name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Backup Custom Native Android Source
        run: |
          mkdir -p /tmp/android_backup
          if [ -d "android/app/src/main/java/com/idxgaza/traneem" ]; then
            cp -r android/app/src/main/java/com/idxgaza/traneem /tmp/android_backup/
          fi
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/android_backup/
          fi

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Restore and Integrate Custom Native Code
        run: |
          mkdir -p android/app/src/main/java/com/idxgaza/traneem
          if [ -d "/tmp/android_backup/traneem" ]; then
            cp -r /tmp/android_backup/traneem/* android/app/src/main/java/com/idxgaza/traneem/
          fi
          if [ -f "/tmp/android_backup/AndroidManifest.xml" ]; then
            cp /tmp/android_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Configure Gradle for Kotlin & MediaSession
        run: |
          # Add Kotlin plugin to root build.gradle if missing
          if ! grep -q "kotlin-gradle-plugin" android/build.gradle; then
            sed -i '/dependencies {/a \        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"' android/build.gradle
          fi

          # Apply Kotlin and add media dependency in app/build.gradle
          if ! grep -q "kotlin-android" android/app/build.gradle; then
            sed -i '/apply plugin: .com.android.application./a apply plugin: "kotlin-android"' android/app/build.gradle
          fi

          if ! grep -q "androidx.media:media" android/app/build.gradle; then
            sed -i '/dependencies {/a \    implementation "androidx.media:media:1.7.0"\n    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"' android/app/build.gradle
          fi

      - name: Prepare google-services.json
        run: |
          python3 -c '
          import base64, os

          os.makedirs("android/app", exist_ok=True)

          s_b64 = """${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}""".strip()
          s_json = """${{ secrets.GOOGLE_SERVICES_JSON }}""".strip()

          def try_decode(s):
              if not s:
                  return None
              try:
                  clean = "".join(s.split())
                  missing_padding = len(clean) % 4
                  if missing_padding:
                      clean += "=" * (4 - missing_padding)
                  data = base64.b64decode(clean)
                  if len(data) > 0 and (b"{" in data or b"project_info" in data):
                      return data
              except Exception:
                  pass
              return None

          decoded = try_decode(s_b64)
          if decoded:
              print("Decoded google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret.")
              with open("android/app/google-services.json", "wb") as f:
                  f.write(decoded)
          elif s_json:
              print("Writing google-services.json from GOOGLE_SERVICES_JSON secret.")
              with open("android/app/google-services.json", "w") as f:
                  f.write(s_json)
          elif os.path.exists("google-services.json"):
              print("Copying google-services.json from repository root...")
              with open("google-services.json", "rb") as f_in, open("android/app/google-services.json", "wb") as f_out:
                  f_out.write(f_in.read())
          else:
              print("Warning: No google-services.json found.")
          '

      - name: Prepare debug.keystore (Decode from Secret or Use Fixed Keystore)
        run: |
          mkdir -p ~/.android
          python3 -c '
          import base64, os

          s_b64 = """${{ secrets.DEBUG_KEYSTORE_BASE64 }}""".strip()
          s_raw = """${{ secrets.DEBUG_KEYSTORE }}""".strip()

          def try_decode(s):
              if not s:
                  return None
              try:
                  clean = "".join(s.split())
                  missing_padding = len(clean) % 4
                  if missing_padding:
                      clean += "=" * (4 - missing_padding)
                  data = base64.b64decode(clean)
                  if len(data) > 0:
                      return data
              except Exception as e:
                  print("Base64 decode warning:", e)
              return None

          data = try_decode(s_b64) or try_decode(s_raw)

          if data:
              print("Successfully decoded debug.keystore from secrets.")
              with open("debug.keystore", "wb") as f:
                  f.write(data)
          elif os.path.exists("debug.keystore") and os.path.getsize("debug.keystore") > 500:
              print("Using pre-existing debug.keystore from repository.")
          elif os.path.exists("keystore_fixed.b64"):
              print("Decoding fixed debug.keystore from repository...")
              with open("keystore_fixed.b64", "r") as f_in:
                  fixed_data = base64.b64decode(f_in.read().strip())
                  with open("debug.keystore", "wb") as f_out:
                      f_out.write(fixed_data)
          else:
              print("Generating debug.keystore fallback...")
              os.system("""keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000""")
          '
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore android/app/debug.keystore

      - name: Print Keystore SHA-1 and SHA-256 Fingerprints
        run: |
          echo "==================== ANDROID KEYSTORE FINGERPRINTS ===================="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android
          echo "======================================================================="
          base64 -w 0 debug.keystore > keystore_base64.txt || base64 debug.keystore > keystore_base64.txt
          echo "Keystore base64 saved to keystore_base64.txt and uploaded to Artifacts."

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure strings.xml for GoogleAuth
        run: |
          mkdir -p android/app/src/main/res/values
          if [ -f android/app/src/main/res/values/strings.xml ]; then
            if grep -q "server_client_id" android/app/src/main/res/values/strings.xml; then
              sed -i 's|<string name="server_client_id">.*</string>|<string name="server_client_id">911335724064-2fsqm3qlsciugqe7tri6vk33814uuerq.apps.googleusercontent.com</string>|' android/app/src/main/res/values/strings.xml
            else
              sed -i 's|</resources>|    <string name="server_client_id">911335724064-2fsqm3qlsciugqe7tri6vk33814uuerq.apps.googleusercontent.com</string>\n</resources>|' android/app/src/main/res/values/strings.xml
            fi
          else
            cat > android/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">ترانيم</string>
              <string name="title_activity_main">ترانيم</string>
              <string name="package_name">com.idxgaza.traneem</string>
              <string name="custom_url_scheme">com.idxgaza.traneem</string>
              <string name="server_client_id">911335724064-2fsqm3qlsciugqe7tri6vk33814uuerq.apps.googleusercontent.com</string>
          </resources>
          EOF
          fi
          cat android/app/src/main/res/values/strings.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug.keystore
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: |
            debug.keystore
            keystore_base64.txt
